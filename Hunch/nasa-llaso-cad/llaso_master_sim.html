<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LLASO Master Simulation — NASA HUNCH 2026-27</title>
<style>
  html,body{margin:0;height:100%;background:#070b12;color:#e2e8f0;font:12px/1.35 ui-sans-serif,system-ui,sans-serif}
  #app{display:grid;grid-template-columns:220px minmax(280px,1fr) 240px;grid-template-rows:minmax(0,1fr) 200px;height:100vh}
  #left,#right{overflow:auto;background:#0b1220;padding:10px 12px;border-color:#1e293b;border-style:solid}
  #left{border-right-width:1px;grid-column:1;grid-row:1/3}
  #right{border-left-width:1px;grid-column:3;grid-row:1/3}
  #view{grid-column:2;grid-row:1;position:relative;min-width:0;min-height:0}
  #table-wrap{grid-column:2;grid-row:2;overflow:auto;border-top:1px solid #1e293b;background:#0b1220}
  body.split #app{grid-template-rows:38vh 1fr}
  h1{font-size:14px;margin:0 0 4px;letter-spacing:.04em}
  .sub{color:#94a3b8;margin:0 0 8px}
  button,select{font:inherit;color:#e2e8f0;background:#111827;border:1px solid #334155;border-radius:6px;padding:4px 6px}
  button{cursor:pointer;text-align:left}
  button:hover{border-color:#38bdf8}
  button.phase{width:100%;margin:8px 0 4px;background:transparent;border:0;color:#38bdf8;font-weight:700;cursor:default;padding:0}
  button.mission{display:block;width:100%;margin:2px 0}
  .row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .row>*{flex:1}
  label{color:#94a3b8;display:block;margin-top:6px}
  #log,#custody,#exceptions{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:10px;color:#cbd5e1}
  #log div,#custody div{border-bottom:1px solid #1e293b;padding:2px 0}
  table{border-collapse:collapse;width:100%;font-size:10px}
  th,td{border-bottom:1px solid #1e293b;padding:3px 5px;text-align:left;white-space:nowrap}
  th{position:sticky;top:0;background:#111827;z-index:1}
  tr.fault td{background:#7f1d1d;color:#fee2e2}
  #search{width:100%;box-sizing:border-box;margin:6px 0;background:#020617;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:4px 6px}
  .hidden{display:none}
  #modal{position:fixed;inset:6vh 8vw;background:#0f172a;border:1px solid #38bdf8;z-index:30;overflow:auto;padding:16px;border-radius:10px}
  .bar{height:10px;background:#1e293b;border-radius:4px;margin:3px 0 8px}
  .bar>span{display:block;height:100%;background:#38bdf8;border-radius:4px}
  .kpi b{color:#7dd3fc}
</style>
</head>
<body>
<div id="app">
  <aside id="left">
    <h1>LLASO MASTER SIM</h1>
    <p class="sub">P1 logistics module · P2 surface rovers · P3 gantry · 18 missions</p>
    <label>Simulation speed</label>
    <select id="speed"><option value="1">1×</option><option value="5">5×</option><option value="20" selected>20×</option></select>
    <label>Gravity</label>
    <select id="gravity"><option value="earth">1.0 g Earth</option><option value="transit">0 g Transit</option><option value="moon" selected>1/6 g Moon</option></select>
    <label>Color coding</label>
    <select id="color-mode">
      <option value="day">By day 1–14</option>
      <option value="type">By cargo type</option>
      <option value="priority">By priority</option>
      <option value="actor">By assigned actor</option>
      <option value="lifecycle">By lifecycle</option>
    </select>
    <label>Rover override</label>
    <div class="row">
      <select id="rover-pick"><option value="r1">External Robot 1</option><option value="r2">External Robot 2</option></select>
      <label style="margin:0;align-self:center"><input id="manual" type="checkbox" /> WASD</label>
    </div>
    <div id="missions"></div>
    <div class="row">
      <button id="btn-inject" type="button">Inject Pre-Launch Errors</button>
      <button id="btn-audit" type="button">Run Digital Verification Audit</button>
    </div>
    <p class="sub">WASD yaws and drives the selected rover when Manual is checked. A* missions queue their own motion.</p>
  </aside>
  <div id="view"></div>
  <aside id="right">
    <div id="status" class="kpi">Booting…</div>
    <div id="cogline" class="kpi"></div>
    <div id="socline" class="kpi"></div>
    <div id="traceline" class="kpi"></div>
    <div id="kpi" class="kpi"></div>
    <h2 style="font-size:12px">Exceptions</h2>
    <div id="exceptions"></div>
    <h2 style="font-size:12px">Chain of custody</h2>
    <div id="custody"></div>
    <h2 style="font-size:12px">Mission log</h2>
    <div id="log"></div>
  </aside>
  <div id="table-wrap">
    <input id="search" placeholder="Search manifest (10 fields)" />
    <table>
      <thead><tr id="thead"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>
<div id="modal" class="hidden"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  var COLS = ['Item_ID','Day_Needed','Mission_Activity','Current_Location','Destination','Priority','Handling_Requirements','Assigned_Actor','Retrieval_Time_Sec','Lifecycle_Status'];
  var ACTIVITIES = ['Meal','EVA','Science','Maintenance','Fabrication','Medical'];
  var DEST = {Meal:'Galley', EVA:'EVA Airlock', Science:'Science Lab', Maintenance:'Maintenance Bay', Medical:'Medical Bay', Fabrication:'3D Fabrication Lab'};
  var ACTORS = ['Astronaut','External Cargo Robot','Internal Cargo Robot','Mechanical/Automated Handling System','Fabrication System','Maintenance/Repair System','Mission Control'];
  var CATS = ['Consumed','Installed','Stored','Fabricated','Recycled','Discarded','Return'];

  var items = [];
  var kits = [];
  var queue = [];
  var activeJob = null;
  var keys = {};
  var moduleGroup, habitat, gantryCar, habBot, cogMesh, pathLine, slideMesh;
  var rover1, rover2, camera, controls, renderer, scene, sun;
  var meshes = {};
  var dummy = new THREE.Object3D();
  var cA = new THREE.Color();
  var cB = new THREE.Color();
  var v1 = new THREE.Vector3();

  var state = {
    speed: 20, gravity: 'moon', g: 1.625, colorMode: 'day', cam: 'module',
    roverId: 'r1', manual: false, time: 0, day: 1, seq: {},
    exceptions: [], cog: {x:6.1,y:1,z:0,kg:0}, cogOk: true,
    slots: [], cradles: [], cradleUsed: [false,false,false,false],
    grid: {x0:-32, z0:-20, cell:2, nx:34, nz:22},
    slide: false, block: null, faulted: false, faultSnap: null,
    searchMin: null, effort: null, reclaimM3: 0, account: null,
    mPerUnit: 4, startMass: 0, highlights: {},
    soc1: 92, soc2: 97
  };

  var MISSIONS = [
    ['I — Earth: plan, optimize, load', [
      [1,'1 Build 14-day manifest'],
      [2,'2 LIFO loading sequence'],
      [3,'3 3D container optimization'],
      [4,'4 Perishable, fragile, hazardous'],
      [5,'5 Load by mission kits'],
      [6,'6 Departure verification']
    ]],
    ['II — Moon: unload, retrieve, deliver', [
      [7,'7 Day 1 open container'],
      [8,'8 Robot-to-robot handoff'],
      [9,'9 Retrieve today kits'],
      [10,'10 Astronaut effort challenge'],
      [11,'11 Consume, replace, remove'],
      [12,'12 14-day accountability']
    ]],
    ['III — Innovation and autonomy', [
      [13,'13 Zero-search pre-stage'],
      [14,'14 Self-reorganizing container'],
      [15,'15 Missing component Day 9'],
      [16,'16 Garbage becomes resource'],
      [17,'17 Lunar logistics emergency'],
      [18,'18 Grand challenge report']
    ]]
  ];

  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function nid(prefix){
    state.seq[prefix] = (state.seq[prefix] || 0) + 1;
    return prefix + '-' + ('000' + state.seq[prefix]).slice(-3);
  }
  function actorFor(handling){
    var h = handling.toLowerCase();
    if (h.indexOf('medical intervention') >= 0 || h.indexOf('safety authorization') >= 0 || h.indexOf('delicate') >= 0 || h.indexOf('hazardous') >= 0) return 'Astronaut';
    if (h.indexOf('filament') >= 0 || h.indexOf('fabricated') >= 0) return 'Fabrication System';
    if (h.indexOf('dust-seal') >= 0 || h.indexOf('latch retention') >= 0) return 'Mechanical/Automated Handling System';
    if (h.indexOf('motor fault') >= 0 || h.indexOf('component swap') >= 0) return 'Maintenance/Repair System';
    if (h.indexOf('manifest override') >= 0 || h.indexOf('departure verification') >= 0) return 'Mission Control';
    if (h.indexOf('surface transport') >= 0) return 'External Cargo Robot';
    return 'Internal Cargo Robot';
  }
  function log(msg){
    var el = document.getElementById('log');
    var d = document.createElement('div');
    d.textContent = msg;
    el.insertBefore(d, el.firstChild);
    while (el.children.length > 60) el.removeChild(el.lastChild);
  }
  function custody(msg){
    var el = document.getElementById('custody');
    var d = document.createElement('div');
    d.textContent = msg;
    el.insertBefore(d, el.firstChild);
  }
  function rfid(id, step){
    var s = id + '|' + step + '|LLASO-2026';
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
    return ('00000000' + (h >>> 0).toString(16)).slice(-8);
  }
  function selectedRover(){ return state.roverId === 'r2' ? rover2 : rover1; }

  function play(seconds, tick, done){
    queue.push({dur: Math.max(0.05, seconds), t: 0, tick: tick || function(){}, done: done || null});
  }
  function pump(dt){
    if (!activeJob) activeJob = queue.shift() || null;
    if (!activeJob) return;
    activeJob.t += dt * state.speed;
    var u = Math.min(1, activeJob.t / activeJob.dur);
    activeJob.tick(u);
    if (u >= 1) {
      var fin = activeJob.done;
      activeJob = null;
      if (fin) fin();
      renderTable();
      renderKpi();
    }
  }
  function clearQueue(){ queue.length = 0; activeJob = null; }

  function getH(x, z){
    var h = 0;
    function crater(cx, cz, r, d){
      var dist = Math.hypot(x - cx, z - cz);
      if (dist < r) h -= d * Math.cos((dist / r) * Math.PI * 0.5);
    }
    crater(2, 3, 8, 1.35);
    crater(-12, -7, 5, 0.65);
    crater(10, -9, 4.2, 0.45);
    if (x < -14 && Math.abs(z) < 8) h *= 0.08;
    if (x > 16 && Math.abs(z) < 8) h *= 0.08;
    return h;
  }

  function makeRover(id, hex){
    var g = new THREE.Group();
    g.name = id;
    var bodyMat = new THREE.MeshStandardMaterial({color: hex, metalness: 0.45, roughness: 0.42});
    var dark = new THREE.MeshStandardMaterial({color: 0x1e293b, metalness: 0.3, roughness: 0.55});
    var body = new THREE.Mesh(new THREE.BoxGeometry(1.35, 0.28, 0.78), bodyMat);
    body.position.y = 0.38;
    g.add(body);
    var bed = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.22, 0.62), dark);
    bed.position.set(-0.05, 0.58, 0);
    g.add(bed);
    var collarMat = new THREE.MeshStandardMaterial({color: 0xf59e0b, emissive: 0x7c2d12, metalness: 0.6, roughness: 0.28});
    var collar = new THREE.Mesh(new THREE.TorusGeometry(0.75, 0.045, 10, 28), collarMat);
    collar.rotation.y = Math.PI / 2;
    collar.position.set(0.95, 0.48, 0);
    g.add(collar);
    var wheels = [];
    [[0.48, 0.32], [0.48, -0.32], [0.0, 0.36], [0.0, -0.36], [-0.5, 0.32], [-0.5, -0.32]].forEach(function (p) {
      var arm = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.04, 0.04), dark);
      arm.position.set(p[0], 0.22, p[1] * 0.7);
      g.add(arm);
      var w = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.1, 12), new THREE.MeshStandardMaterial({color: 0x334155, roughness: 0.85}));
      w.rotation.z = Math.PI / 2;
      w.position.set(p[0], 0.16, p[1]);
      g.add(w);
      wheels.push(w);
    });
    g.userData.wheels = wheels;
    g.userData.body = body;
    g.userData.collar = collar;
    g.userData.fault = false;
    g.userData.id = id;
    return g;
  }

  function initScene(){
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b12);
    scene.fog = new THREE.Fog(0x070b12, 50, 140);
    camera = new THREE.PerspectiveCamera(50, 1, 0.1, 400);
    var view = document.getElementById('view');
    renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    view.appendChild(renderer.domElement);
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxDistance = 140;
    scene.add(new THREE.AmbientLight(0x8ea2c0, 0.55));
    sun = new THREE.DirectionalLight(0xfff4e0, 1.35);
    sun.position.set(40, 14, -18);
    scene.add(sun);

    var geo = new THREE.PlaneGeometry(78, 48, 90, 50);
    geo.rotateX(-Math.PI / 2);
    var pos = geo.attributes.position;
    for (var i = 0; i < pos.count; i++) pos.setY(i, getH(pos.getX(i), pos.getZ(i)));
    geo.computeVertexNormals();
    var ground = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color: 0x6b5a48, roughness: 0.95, metalness: 0.02}));
    scene.add(ground);

    moduleGroup = new THREE.Group();
    moduleGroup.position.set(-18, 1.72, 0);
    scene.add(moduleGroup);
    var shell = new THREE.Mesh(
      new THREE.CylinderGeometry(1.5, 1.5, 12.192, 28, 1, true, Math.PI * 0.15, Math.PI * 1.35),
      new THREE.MeshStandardMaterial({color: 0xb6c2d1, metalness: 0.55, roughness: 0.32, side: THREE.DoubleSide, transparent: true, opacity: 0.42})
    );
    shell.rotation.z = Math.PI / 2;
    shell.position.x = 6.096;
    moduleGroup.add(shell);
    var floor = new THREE.Mesh(new THREE.BoxGeometry(12.0, 0.06, 2.3), new THREE.MeshStandardMaterial({color: 0x1e293b, roughness: 0.8}));
    floor.position.set(6.096, 0.12, 0);
    moduleGroup.add(floor);
    var corridor = new THREE.Mesh(new THREE.BoxGeometry(12.0, 2.1, 1.2), new THREE.MeshBasicMaterial({color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.18}));
    corridor.position.set(6.096, 1.15, 0);
    moduleGroup.add(corridor);
    var bulk = new THREE.Mesh(new THREE.CircleGeometry(1.48, 24), new THREE.MeshStandardMaterial({color: 0x475569, metalness: 0.4, roughness: 0.5, side: THREE.DoubleSide}));
    bulk.rotation.y = Math.PI / 2;
    bulk.position.x = 12.15;
    moduleGroup.add(bulk);
    var aftRing = new THREE.Mesh(new THREE.TorusGeometry(0.72, 0.04, 8, 24), new THREE.MeshStandardMaterial({color: 0x22d3ee, emissive: 0x155e75}));
    aftRing.rotation.y = Math.PI / 2;
    aftRing.position.set(0.05, 1.0, 0);
    moduleGroup.add(aftRing);

    state.slots = buildSlots();
    state.slots.forEach(function (s) {
      var shelf = new THREE.Mesh(new THREE.BoxGeometry(1.02, 0.035, 0.62), new THREE.MeshStandardMaterial({color: s.powered ? 0x0f766e : 0x334155, metalness: 0.4, roughness: 0.45}));
      shelf.position.set(s.x, s.y - 0.16, s.z);
      moduleGroup.add(shelf);
    });
    state.cradles = [
      {x:1.15,y:0.55,z:-1.22,bay:2,side:'starboard',tier:'A',col:0},
      {x:1.15,y:0.55,z:1.22,bay:1,side:'port',tier:'A',col:0},
      {x:10.9,y:0.55,z:-1.22,bay:20,side:'starboard',tier:'A',col:9},
      {x:10.9,y:0.55,z:1.22,bay:19,side:'port',tier:'A',col:9}
    ];
    state.cradles.forEach(function (c) {
      var cradle = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.03, 6, 12), new THREE.MeshStandardMaterial({color: 0xd6d3d1, metalness: 0.7, roughness: 0.3}));
      cradle.rotation.y = Math.PI / 2;
      cradle.position.set(c.x, c.y, c.z);
      moduleGroup.add(cradle);
    });

    var rail = new THREE.Mesh(new THREE.BoxGeometry(12.0, 0.06, 0.08), new THREE.MeshStandardMaterial({color: 0xe2e8f0, metalness: 0.8, roughness: 0.25}));
    rail.position.set(6.096, 2.05, 0);
    moduleGroup.add(rail);
    gantryCar = new THREE.Group();
    gantryCar.position.set(1, 1.7, 0);
    var mast = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.7, 0.12), new THREE.MeshStandardMaterial({color: 0xfbbf24, metalness: 0.5, roughness: 0.35}));
    var grip = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.08, 0.2), new THREE.MeshStandardMaterial({color: 0xf59e0b}));
    grip.position.y = -0.4;
    gantryCar.add(mast, grip);
    moduleGroup.add(gantryCar);

    cogMesh = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 12), new THREE.MeshStandardMaterial({color: 0xf472b6, emissive: 0xbe185d}));
    moduleGroup.add(cogMesh);

    habitat = new THREE.Group();
    habitat.position.set(24, 0, 0);
    scene.add(habitat);
    var hab = new THREE.Mesh(new THREE.BoxGeometry(6.2, 2.6, 4.2), new THREE.MeshStandardMaterial({color: 0xe2e8f0, roughness: 0.55, metalness: 0.2}));
    hab.position.y = 1.3;
    habitat.add(hab);
    var dock = new THREE.Mesh(new THREE.TorusGeometry(0.72, 0.05, 8, 20), new THREE.MeshStandardMaterial({color: 0x22d3ee, emissive: 0x155e75}));
    dock.rotation.y = Math.PI / 2;
    dock.position.set(-3.15, 1.15, 0);
    habitat.add(dock);
    Object.keys(DEST).forEach(function (act, idx) {
      var p = stationPos(DEST[act]);
      var m = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.08, 0.35), new THREE.MeshStandardMaterial({color: 0x38bdf8, emissive: 0x0c4a6e}));
      m.position.set(p.x, 0.2, p.z);
      habitat.add(m);
    });
    habBot = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.28, 0.35), new THREE.MeshStandardMaterial({color: 0xfbbf24, metalness: 0.4}));
    habBot.position.set(-2.2, 0.4, 0);
    habitat.add(habBot);

    rover1 = makeRover('r1', 0x0e7490);
    rover2 = makeRover('r2', 0xb45309);
    rover1.position.set(-21.2, 0.4, 2.2);
    rover2.position.set(-21.2, 0.4, -2.4);
    scene.add(rover1, rover2);
    snapRover(rover1); snapRover(rover2);

    var boxGeo = new THREE.BoxGeometry(1, 1, 1);
    var cylGeo = new THREE.CylinderGeometry(0.5, 0.5, 1, 16);
    function inst(geo, mat){
      var mesh = new THREE.InstancedMesh(geo, mat, 120);
      mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      mesh.frustumCulled = false;
      scene.add(mesh);
      return mesh;
    }
    var std = function (c) {
      return new THREE.MeshStandardMaterial({color: c, roughness: 0.55, metalness: 0.2, vertexColors: true});
    };
    meshes.ctb = inst(boxGeo, std(0xffffff));
    meshes.locker = inst(boxGeo, std(0xffffff));
    meshes.pod = inst(cylGeo, std(0xffffff));
    meshes.halo = inst(boxGeo, new THREE.MeshBasicMaterial({color: 0xffffff, transparent: true, opacity: 0.28, depthWrite: false, vertexColors: true}));

    pathLine = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({color: 0x22d3ee}));
    scene.add(pathLine);
    slideMesh = new THREE.Mesh(new THREE.BoxGeometry(12, 0.35, 5), new THREE.MeshBasicMaterial({color: 0xef4444, transparent: true, opacity: 0.28}));
    slideMesh.position.set(6, 0.2, 0);
    slideMesh.visible = false;
    scene.add(slideMesh);

    var aft = new THREE.Vector3();
    var habDock = new THREE.Vector3(-3.15, 1.15, 0);
    moduleGroup.localToWorld(aft.set(0, 1, 0));
    habitat.localToWorld(habDock);
    state.mPerUnit = 150 / Math.max(1, aft.distanceTo(habDock));
    state.aftWorld = aft.clone();
    state.habDockWorld = habDock.clone();

    window.addEventListener('resize', resize);
    resize();
    applyCam('module');
  }

  function stationPos(name){
    var map = {
      'Galley': {x:-1.4,y:0.9,z:1.2},
      'EVA Airlock': {x:0.2,y:0.9,z:1.3},
      'Science Lab': {x:1.6,y:0.9,z:0.8},
      'Maintenance Bay': {x:1.5,y:0.9,z:-1.0},
      'Medical Bay': {x:-0.2,y:0.9,z:-1.2},
      '3D Fabrication Lab': {x:-1.6,y:0.9,z:-0.6},
      'Dock': {x:-2.4,y:0.9,z:0}
    };
    return map[name] || map.Dock;
  }
  function buildSlots(){
    var slots = [];
    var pitch = (12.192 - 0.7) / 10;
    for (var col = 0; col < 10; col++) {
      var x = 0.35 + pitch * (col + 0.5);
      for (var si = 0; si < 2; si++) {
        for (var t = 0; t < 4; t++) {
          slots.push({
            col: col, side: si === 0 ? 'port' : 'starboard', bay: col * 2 + 1 + si,
            tier: 'ABCD'[t], x: x, y: 0.36 + t * 0.46, z: si === 0 ? -0.95 : 0.95,
            cap: 2, used: 0, mass: 0, powered: (col * 2 + 1 + si) <= 2, occ: []
          });
        }
      }
    }
    return slots;
  }
  function slotAt(col, si, t){
    if (col < 0 || col > 9 || si < 0 || si > 1 || t < 0 || t > 3) return null;
    return state.slots[col * 8 + si * 4 + t];
  }
  function resetSlots(){
    state.slots.forEach(function (s) { s.used = 0; s.mass = 0; s.occ.length = 0; });
    state.cradleUsed = [false, false, false, false];
  }
  function resize(){
    var view = document.getElementById('view');
    var w = view.clientWidth || 800, h = view.clientHeight || 600;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  function applyCam(mode){
    state.cam = mode;
    document.body.classList.toggle('split', mode === 'split');
    resize();
    scene.updateMatrixWorld(true);

    log('Mission 15 — Day 9 O2 scrubber valve missing. Scoring substitute / repair / cannibalize / fabricate.');
    var valve = items.filter(function (it) { return it.Item_ID === 'SPARE-O2-SCRUB-VALVE-D09'; })[0];
    if (!valve) { log('Valve record was not on the manifest.'); return; }
    valve.Lifecycle_Status = 'Missing';
    valve.Current_Location = 'NOT IN BAY';
    valve.fault = true;
    var scores = {Substitute:0.22, Repair:0.31, Cannibalize:0.38, Fabricate:0.93};
    log('Scores ' + JSON.stringify(scores) + '. Select Fabrication System.');
    var feed = items.filter(function (it) { return it.category === 'Fabrication Feedstock' && it.massKg > 1; })[0];
    var kit = kitOfItem(feed);
    moveGantry(kit.x, kit.z, 0.9, function () {
      feed.massKg = Math.max(0.2, feed.massKg - 0.42);
      kit.massKg = kit.items.reduce(function (s, it) { return s + it.massKg; }, 0);
      var part = {
        Item_ID: 'FAB-O2-VALVE-D09', Day_Needed: 9, Mission_Activity: 'Maintenance',
        Current_Location: '3D Fabrication Lab', Destination: 'Habitat — Maintenance Bay',
        Priority: 1, Handling_Requirements: 'Fabricated replacement valve',
        Assigned_Actor: 'Fabrication System', Retrieval_Time_Sec: 0, Lifecycle_Status: 'Fabricated',
        massKg: 0.42, category: 'Spare Parts', kitId: kit.id, fault: false, latch: true
      };
      items.push(part);
      kit.items.push(part);
      kit.carrier = 'habitat';
      kit.station = '3D Fabrication Lab';
      setLoc(kit, '3D Fabrication Lab — print complete');
      valve.Lifecycle_Status = 'Consumed';
      valve.fault = false;
      valve.Current_Location = 'Scrapped missing stock';
      var p = stationPos('3D Fabrication Lab');
      habBot.position.set(p.x, 0.4, p.z);
      log('Printed FAB-O2-VALVE-D09 from feedstock. Mass books stay closed (0.42 kg moved).');
    });
  }
  function mission16(){
    var vol = 0, n = 0;
    items.forEach(function (it) {
      var empty = it.Handling_Requirements.indexOf('Empty CTB') >= 0 || (it.category === 'Food' && it.Lifecycle_Status !== 'Fabricated');
      if (it.category === 'Food') {
        it.Lifecycle_Status = 'Recycled';
        it.Handling_Requirements = 'Nomex CTB reformed into radiation-shielding tile';
        it.Current_Location = 'Habitat shield wall';
        it.Assigned_Actor = 'Fabrication System';
        vol += 0.50 * 0.42 * 0.25;
        n++;
      } else if (it.category === 'Clothing' && it.Day_Needed % 2 === 0) {
        it.Lifecycle_Status = 'Recycled';
        it.Handling_Requirements = 'Plastic packaging shredded to printer filament';
        it.Assigned_Actor = 'Fabrication System';
        vol += 0.004;
        n++;
      }
    });
    state.reclaimM3 = vol;
    log('Mission 16 — ' + n + ' waste items converted. Volume reclaimed ' + vol.toFixed(3) + ' m³.');
    renderKpi();
  }
  function mission17(){
    log('Mission 17 — EVA in progress, urgent medical kit, regolith slide, Rover 1 motor fault.');
    state.slide = true;
    state.block = {x0: 0, x1: 12, z0: -2.6, z1: 2.6};
    slideMesh.visible = true;
    var med = kitById('KIT-D01-Medical') || kits.filter(function (k) { return k.items.some(function (it) { return it.Item_ID === 'EMER-MED-D01'; }); })[0];
    rover1.userData.fault = false;
    var pts = [];
    for (var x = rover1.position.x; x <= -3; x += 2) pts.push({x: x, z: 0.4});
    pts.push({x: -3, z: 0.4});
    driveAlong(rover1, pts, function () {
      rover1.userData.fault = true;
      log('Rover 1 drive motor fault at the slide. Maintenance/Repair System flags the channel. Dispatch Rover 2.');
      med.items.forEach(function (it) { it.Assigned_Actor = 'Maintenance/Repair System'; });
      driveAlong(rover2, astar(rover2.position.x, rover2.position.z, rover1.position.x, rover1.position.z - 1.2), function () {
        med.carrier = 'rover2';
        med.bedZ = 0;
        setLoc(med, 'Field transfer — External Cargo Robot 2');
        setActors(med, 'External Cargo Robot');
        med.items.forEach(function (it) { custody(it.Item_ID + ' rover-to-rover RFID=' + rfid(it.Item_ID, 'FIELD')); });
        log('Cargo transferred off the faulted rover.');
        var goal = state.habDockWorld;
        driveAlong(rover2, astar(rover2.position.x, rover2.position.z, goal.x, goal.z), function () {
          seal(rover2, true);
          med.carrier = 'habitat';
          med.station = 'Medical Bay';
          setLoc(med, 'Habitat — Medical Bay');
          setActors(med, 'Internal Cargo Robot');
          var p = stationPos('Medical Bay');
          habBot.position.set(p.x, 0.4, p.z);
          log('Emergency medical kit delivered by Rover 2 on the detour. Collar sealed. Dust excluded.');
        });
      });
    });
  }
  function mission18(){
    log('Mission 18 — seeded 14-day stress test.');
    var rng = mulberry32(202627);
    var shifts = 0;
    items.forEach(function (it, idx) {
      if (rng() < 0.04 && it.Day_Needed < 14) { it.Day_Needed += 1; shifts++; it.Handling_Requirements += ' · schedule slip'; }
      if (idx === 40) { it.Assigned_Actor = 'Mission Control'; it.Handling_Requirements = 'Manifest override — emergency routing approval'; }
    });
    rover2.userData.fault = true;
    play(0.6, function (u) { gantryCar.position.x = 1 + u * 8; }, function () {
      rover2.userData.fault = false;
      log('Maintenance/Repair System cleared Rover 2. Schedule slips: ' + shifts + '.');
      var b = assignLifecyclePartition();
      var s = summary();
      showReport(s, b, shifts);
    });
  }
  function mulberry32(a){
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = (t + Math.imul(t ^ t >>> 7, 61 | t)) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function showReport(s, buckets, shifts){
    var modal = document.getElementById('modal');
    modal.classList.remove('hidden');
    modal.textContent = '';
    var h = document.createElement('h2');
    h.textContent = 'Final Executive Report — Autonomous Lunar Supply Chain';
    modal.appendChild(h);
    var p = document.createElement('p');
    p.textContent = s.items + ' tracked items, ' + s.kits + ' containers, ' + s.mass.toFixed(1) + ' kg, ' + shifts + ' schedule slips, search time ' + (state.searchMin == null ? 'n/a' : state.searchMin.toFixed(1) + ' min') + '.';
    modal.appendChild(p);
    CATS.forEach(function (c) {
      var lab = document.createElement('div');
      lab.textContent = c + ' ' + buckets[c].toFixed(1) + ' kg';
      var bar = document.createElement('div');
      bar.className = 'bar';
      var span = document.createElement('span');
      span.style.width = Math.min(100, (buckets[c] / s.mass) * 100) + '%';
      bar.appendChild(span);
      modal.appendChild(lab);
      modal.appendChild(bar);
    });
    var row = document.createElement('div');
    row.className = 'row';
    var bj = document.createElement('button');
    bj.textContent = 'Export JSON';
    bj.onclick = function () { download('llaso_manifest.json', JSON.stringify({cog: state.cog, account: state.account, items: items}, null, 2)); };
    var bc = document.createElement('button');
    bc.textContent = 'Export CSV';
    bc.onclick = function () { download('llaso_manifest.csv', toCSV()); };
    var bx = document.createElement('button');
    bx.textContent = 'Close';
    bx.onclick = function () { modal.classList.add('hidden'); };
    row.appendChild(bj); row.appendChild(bc); row.appendChild(bx);
    modal.appendChild(row);
    log('Grand challenge report ready. Accountability ' + (state.account ? state.account.pct.toFixed(1) : '0') + '%.');
  }
  function toCSV(){
    var lines = [COLS.join(',')];
    items.forEach(function (it) {
      lines.push(COLS.map(function (c) { return '"' + String(it[c]).replace(/"/g, '""') + '"'; }).join(','));
    });
    return lines.join('\n');
  }
  function download(name, text){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], {type: 'text/plain'}));
    a.download = name;
    a.click();
  }

  var handlers = {1:mission1,2:mission2,3:mission3,4:mission4,5:mission5,6:mission6,7:mission7,8:mission8,9:mission9,10:mission10,11:mission11,12:mission12,13:mission13,14:mission14,15:mission15,16:mission16,17:mission17,18:mission18};
  function runMission(n){
    clearQueue();
    handlers[n]();
    renderTable();
    renderKpi();
    layoutCargo();
  }

  function bootUI(){
    var host = document.getElementById('missions');
    MISSIONS.forEach(function (group) {
      var ph = document.createElement('button');
      ph.className = 'phase';
      ph.type = 'button';
      ph.textContent = group[0];
      host.appendChild(ph);
      group[1].forEach(function (m) {
        var b = document.createElement('button');
        b.className = 'mission';
        b.type = 'button';
        b.textContent = m[1];
        b.onclick = function () { runMission(m[0]); };
        host.appendChild(b);
      });
    });
    var head = document.getElementById('thead');
    COLS.forEach(function (c) {
      var th = document.createElement('th');
      th.textContent = c;
      head.appendChild(th);
    });
    document.getElementById('speed').onchange = function () { state.speed = +this.value; };
    document.getElementById('gravity').onchange = function () { state.gravity = this.value; applyGravity(); };
    document.getElementById('color-mode').onchange = function () { state.colorMode = this.value; layoutCargo(); };
    document.getElementById('rover-pick').onchange = function () { state.roverId = this.value; };
    document.getElementById('manual').onchange = function () { state.manual = this.checked; };
    document.getElementById('btn-inject').onclick = injectFaults;
    document.getElementById('btn-audit').onclick = auditFaults;
    document.getElementById('search').oninput = renderTable;
    document.getElementById('view').addEventListener('dblclick', function () {});
    var cams = document.createElement('div');
    cams.className = 'row';
    [['module','Module cutaway'],['surface','South Pole'],['chase','Rover chase'],['split','Split manifest']].forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = c[1];
      b.onclick = function () { applyCam(c[0]); };
      cams.appendChild(b);
    });
    document.getElementById('left').insertBefore(cams, host);
    window.addEventListener('keydown', function (ev) {
      if (ev.target && ev.target.tagName === 'INPUT') return;
      keys[ev.key.toLowerCase()] = true;
    });
    window.addEventListener('keyup', function (ev) { keys[ev.key.toLowerCase()] = false; });
  }

  function driveManual(dt){
    if (!state.manual || activeJob || queue.length) return;
    var r = selectedRover();
    if (r.userData.fault) return;
    var yaw = 0, thr = 0;
    if (keys.a) yaw += 1;
    if (keys.d) yaw -= 1;
    if (keys.w) thr += 1;
    if (keys.s) thr -= 1;
    if (!yaw && !thr) return;
    r.rotation.y += yaw * 1.3 * dt;
    var fwd = new THREE.Vector3(1, 0, 0).applyQuaternion(r.quaternion);
    r.position.addScaledVector(fwd, thr * 3.2 * dt);
    snapRover(r);
    r.userData.wheels.forEach(function (w) { w.rotation.x += thr * 0.5; });
    var soc = r === rover1 ? 'soc1' : 'soc2';
    state[soc] = Math.max(0, state[soc] - Math.abs(thr) * dt * 0.4);
  }

  function animate(){
    requestAnimationFrame(animate);
    var dt = 0.016;
    state.time += dt;
    pump(dt);
    driveManual(dt);
    if (state.gravity === 'moon') {
      if (!rover1.userData.fault) state.soc1 = Math.min(100, state.soc1 + dt * 0.05);
      if (!rover2.userData.fault) state.soc2 = Math.min(100, state.soc2 + dt * 0.05);
    }
    if (state.cam === 'chase') {
      var r = selectedRover();
      var ideal = r.position.clone().add(new THREE.Vector3(-6.5, 3.4, 5.5));
      camera.position.lerp(ideal, 0.08);
      controls.target.lerp(r.position, 0.15);
    } else controls.update();
    layoutCargo();
    if (Math.floor(state.time * 4) !== Math.floor((state.time - dt) * 4)) renderKpi();
    renderer.render(scene, camera);
  }

  if (typeof THREE === 'undefined') {
    document.getElementById('status').textContent = 'Three.js failed to load. Check the network and reload.';
    return;
  }
  bootUI();
  initScene();
  var sum = buildManifest();
  log('LLASO master sim ready. ' + sum.items + ' items, ' + sum.kits + ' containers, ' + sum.mass.toFixed(1) + ' kg.');
  renderTable();
  renderKpi();
  animate();
  window.LLASO = {
    run: runMission,
    get items(){ return items; },
    get kits(){ return kits; },
    get state(){ return state; }
  };
})();
</script>
