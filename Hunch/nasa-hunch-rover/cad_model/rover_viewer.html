<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autonomous Tracked Lunar Rover - Realistic Digital Twin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #000; color: #f3f4f6; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 0; }
    .glass { background: rgba(10, 15, 25, 0.7); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.1); }
    #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 50; font-size: 24px; font-weight: bold; color: #fbbf24; }
  </style>
</head>
<body class="relative w-full h-full">

  <!-- 3D Canvas -->
  <div id="canvas-container"></div>
  <div id="loading">Loading High-Fidelity Lunar Sim...</div>

  <!-- Top Floating Header -->
  <div class="absolute top-4 left-4 right-4 z-10 flex flex-wrap items-center justify-between gap-3 p-3.5 glass rounded-xl pointer-events-auto">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-lg bg-yellow-500/20 border border-yellow-500/40 flex items-center justify-center text-yellow-400 font-bold text-lg">
        🌖
      </div>
      <div>
        <div class="flex items-center space-x-2">
          <span class="text-sm font-bold text-white tracking-wider">LUNAR SURFACE SIMULATION</span>
          <span class="px-2 py-0.5 text-[10px] bg-blue-500/20 text-blue-300 border border-blue-500/40 rounded font-bold">SOLAR ACTIVE</span>
        </div>
        <div class="text-[11px] text-slate-300">NASA LLASO External Cargo Robot - Terrain Testing Environment</div>
      </div>
    </div>
  </div>

  <script>
    const container = document.getElementById('canvas-container');
    const loadingUI = document.getElementById('loading');
    
    const scene = new THREE.Scene();
    
    // Starry background using points
    const starGeo = new THREE.BufferGeometry();
    const starMats = new THREE.PointsMaterial({color: 0xffffff, size: 0.5});
    const starVerts = [];
    for(let i=0; i<3000; i++) {
        starVerts.push((Math.random()-0.5)*100, (Math.random()-0.5)*100, (Math.random()-0.5)*100);
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVerts, 3));
    const stars = new THREE.Points(starGeo, starMats);
    scene.add(stars);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.05, 100);
    camera.position.set(0.6, 0.4, 0.6);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0.1, 0);
    controls.maxPolarAngle = Math.PI / 2 - 0.01; // Don't go below ground

    // Lighting (Harsh Lunar Sun)
    const ambLight = new THREE.AmbientLight(0x223344, 0.3); // Deep space shadow fill
    scene.add(ambLight);

    const sunLight = new THREE.DirectionalLight(0xfffff0, 2.5);
    sunLight.position.set(5, 4, -3);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 15;
    const d = 1.5;
    sunLight.shadow.camera.left = -d;
    sunLight.shadow.camera.right = d;
    sunLight.shadow.camera.top = d;
    sunLight.shadow.camera.bottom = -d;
    sunLight.shadow.bias = -0.0005;
    scene.add(sunLight);

    // Load Textures
    const texLoader = new THREE.TextureLoader();

    // Add Cinematic Lunar Base Background
    const bgTexture = texLoader.load('assets/lunar_bg.jpg');
    if (THREE.SRGBColorSpace) bgTexture.colorSpace = THREE.SRGBColorSpace;
    else bgTexture.encoding = THREE.sRGBEncoding;
    scene.background = bgTexture;
    const lunarTex = texLoader.load('assets/lunar_surface.jpg');
    lunarTex.wrapS = THREE.RepeatWrapping;
    lunarTex.wrapT = THREE.RepeatWrapping;
    lunarTex.repeat.set(10, 10);
    
    const groundGeo = new THREE.PlaneGeometry(30, 30, 128, 128);
    const groundMat = new THREE.MeshStandardMaterial({ 
        color: 0x999999, 
        map: lunarTex, 
        roughness: 0.95, 
        metalness: 0.05 
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    
    // Add some random bumps to terrain vertices
    const posAttribute = groundGeo.attributes.position;
    for ( let i = 0; i < posAttribute.count; i ++ ) {
        const x = posAttribute.getX(i);
        const y = posAttribute.getY(i);
        let z = Math.sin(x*2)*Math.cos(y*2)*0.02 + Math.sin(x*8)*Math.sin(y*8)*0.005;
        if(x*x + y*y < 1.0) z = 0;
        posAttribute.setZ(i, z);
    }
    groundGeo.computeVertexNormals();
    scene.add(ground);

    // 2. Track Rubber Texture
    const trackTex = texLoader.load('assets/rubber_track.jpg');
    trackTex.wrapS = THREE.RepeatWrapping;
    trackTex.wrapT = THREE.RepeatWrapping;
    trackTex.repeat.set(1, 15);
    
    // 3. Solar Panel Texture
    const solarTex = texLoader.load('assets/solar_panel.jpg');
    solarTex.wrapS = THREE.RepeatWrapping;
    solarTex.wrapT = THREE.RepeatWrapping;
    solarTex.repeat.set(2, 2);

    // Glowing Green Eye Material
    const eyeMat = new THREE.MeshStandardMaterial({ 
        color: 0x4ade80, 
        emissive: 0x22c55e, 
        emissiveIntensity: 2.0, 
        roughness: 0.2 
    });

    // Object Materials
    const materials = {
        'ChassisTruss': new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.15, metalness: 0.1 }), // High-quality white
        'TreadTracks': new THREE.MeshStandardMaterial({ color: 0x222222, map: trackTex, roughness: 0.9, metalness: 0.0 }),
        'Sprockets': new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.6, metalness: 0.3 }),
        'DCMotors': new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.4, metalness: 0.8 }),
        'BrassInserts': new THREE.MeshStandardMaterial({ color: 0xffaa00, roughness: 0.3, metalness: 0.9 }),
        'SensorMast': new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3, metalness: 0.2 }),
        'YDLIDAR': new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.4, metalness: 0.2 }),
        'CameraModule': eyeMat,
        'BatteryPack': new THREE.MeshStandardMaterial({ color: 0x2244bb, roughness: 0.5 }),
        'SolarPanels': new THREE.MeshStandardMaterial({ color: 0x333333, map: solarTex, roughness: 0.1, metalness: 0.6 })
    };

    // Load OBJ File
    const roverGroup = new THREE.Group();
    scene.add(roverGroup);

    // Add glowing light source for the eye
    const eyeLight = new THREE.PointLight(0x4ade80, 2, 2);
    eyeLight.position.set(0.2, 0.15, 0); // Front of the rover
    roverGroup.add(eyeLight);

    const objLoader = new THREE.OBJLoader();
    objLoader.load(
        'tracked_lunar_rover.obj', 
        (object) => {
            object.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    if (materials[child.name]) {
                        child.material = materials[child.name];
                    } else {
                        // Default fallback
                        child.material = materials['ChassisTruss']; 
                    }
                }
            });
            // Center the rover
            object.position.y = 0.005; // Slight offset above ground
            roverGroup.add(object);
            loadingUI.style.display = 'none';
        },
        (xhr) => {
            // Progress callback
        },
        (error) => {
            console.error("Error loading OBJ:", error);
            loadingUI.innerHTML = `
                <div style="color: #ef4444; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; text-align: center;">
                    <h2 style="font-size: 24px; margin-bottom: 10px;">⚠️ Security Block (CORS)</h2>
                    <p style="font-size: 16px;">Your browser blocked the 3D model from loading because you opened the file directly (file:///).</p>
                    <p style="font-size: 16px; margin-top: 10px;">Please use the local web server link instead:</p>
                    <a href="http://localhost:8000/rover_viewer.html" style="color: #60a5fa; font-size: 20px; font-weight: bold; margin-top: 10px; display: block;">http://localhost:8000/rover_viewer.html</a>
                </div>
            `;
        }
    );

    // Simple Animation Loop (Turntable)
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        roverGroup.rotation.y += 0.002; // Slow turn
        
        // Scroll tracks UV
        if(trackTex) trackTex.offset.y -= 0.005;
        
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
